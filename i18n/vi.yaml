## Homepage about
- id: "about_title"
  translation: "Giới thiệu"

- id: "about_content"
  translation: '<p class="lead">Sinh viên Kỹ thuật Phần mềm tại <strong>BTH</strong>, Thụy Điển, theo hướng kết quả thực tế — trực tiếp xây dựng và triển khai các ứng dụng full-stack hoàn chỉnh.</p><p>Đã triển khai thành công một framework giám sát hiệu năng cho Ericsson, được chính đội ngũ khách hàng đánh giá cao về chất lượng kỹ thuật, tinh thần chủ động và thái độ chuyên nghiệp.</p><p>Mang theo hơn 15 năm kỷ luật nghề nghiệp trước đó vào backend, cơ sở dữ liệu, CI/CD, giám sát hệ thống và triển khai containerised.</p>'

- id: "about_button"
