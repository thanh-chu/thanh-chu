## Homepage about
- id: "about_title"
  translation: "Om mig"

- id: "about_content"
  translation: '<p class="lead">Mjukvaruingenjörsstudent vid <strong>BTH</strong>, Sverige, på väg in i teknikbranschen efter 15+ år inom bankverksamhet, finans och förskoleundervisning.</p><p>Jag kombinerar praktiska kodningsfärdigheter, disciplinerat processtänkande och stark kommunikationsförmåga — bevisat genom att leverera ett studentprojekt för Ericsson, leda klientdemos och bli personligen utvald att leda övningssessioner för förstaårsstudenter.</p><p>Bekväm med att arbeta i hela stacken: backend-tjänster, databaser, CI/CD, övervakning och containeriserade driftsättningar.</p>'

- id: "about_button"
  translation: "Se mina kompetenser"

